<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Toy Safety: Where It Gets Tricky</title>
  <desc>Three essential rules for carefree and safe use</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140D1C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Titelzeile -->
  <text x="400" y="44" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="24" font-weight="700">Toy Safety: Where It Gets Tricky</text>
  <text x="400" y="70" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="14">Three essential rules for carefree and safe use</text>

  <!-- Regel 1: Anal-Sicherheit (Rot / Kritisch) -->
  <g transform="translate(40, 96)">
    <rect width="720" height="142" rx="14" fill="url(#card)" stroke="#F43F5E" stroke-width="1.8"/>
    <!-- Ampel-Icon Rot / Schild -->
    <circle cx="56" cy="71" r="28" fill="url(#redGrad)"/>
    <!-- Silhouette Toy mit breitem Fuß -->
    <path d="M56 50 C50 50 48 58 50 64 L42 66 C38 66 38 72 42 72 L70 72 C74 72 74 66 70 66 L62 64 C64 58 62 50 56 50 Z" fill="#FFF"/>
    <line x1="38" y1="74" x2="74" y2="74" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="104" y="42" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">1. Anal Safety: Flared Base Is Mandatory</text>
    <text x="104" y="68" fill="#CBD5E1" font-family="sans-serif" font-size="14">The rectum has no floor. Toys without a flared base can slip inside.</text>
    <rect x="104" y="86" width="590" height="38" rx="8" fill="#881337" fill-opacity="0.5" stroke="#F43F5E" stroke-width="1"/>
    <text x="118" y="110" fill="#FDA4AF" font-family="sans-serif" font-size="13" font-weight="700">✓ ALWAYS: Wide handle or flared base that stays securely outside.</text>
  </g>

  <!-- Regel 2: Gleitmittel (Gelb / Passung) -->
  <g transform="translate(40, 256)">
    <rect width="720" height="142" rx="14" fill="url(#card)" stroke="#FBBF24" stroke-width="1.8"/>
    <!-- Ampel-Icon Gelb / Tropfen -->
    <circle cx="56" cy="71" r="28" fill="url(#amberGrad)"/>
    <path d="M56 50 C56 50 44 64 44 74 C44 80 49 85 56 85 C63 85 68 80 68 74 C68 64 56 50 56 50 Z" fill="#FFF"/>
    
    <text x="104" y="42" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">2. Lubricant: Match with Material</text>
    <text x="104" y="68" fill="#CBD5E1" font-family="sans-serif" font-size="14">Mismatched lube damages surfaces or irritates sensitive mucous membranes.</text>
    <rect x="104" y="86" width="590" height="38" rx="8" fill="#78350F" fill-opacity="0.5" stroke="#FBBF24" stroke-width="1"/>
    <text x="118" y="110" fill="#FDE68A" font-family="sans-serif" font-size="13" font-weight="700">✓ Silicone toys with water-based lube ONLY. Silicone lube degrades silicone.</text>
  </g>

  <!-- Regel 3: Stopp-Signale & Hygiene (Grün / Eigenverantwortung) -->
  <g transform="translate(40, 416)">
    <rect width="720" height="142" rx="14" fill="url(#card)" stroke="#34D399" stroke-width="1.8"/>
    <!-- Ampel-Icon Grün / Hand & Schutz -->
    <circle cx="56" cy="71" r="28" fill="url(#greenGrad)"/>
    <!-- Handflächen-Symbol -->
    <path d="M46 64 L46 56 C46 54 48 54 48 56 L48 64 M50 64 L50 52 C50 50 52 50 52 52 L52 64 M54 64 L54 54 C54 52 56 52 56 54 L56 64 M58 64 L58 58 C58 56 60 56 60 58 L60 68 C60 76 56 82 48 82 C44 82 42 78 42 72 L42 66" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>

    <text x="104" y="42" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">3. Stop Signals &amp; Hygiene: Listen to Your Body</text>
    <text x="104" y="68" fill="#CBD5E1" font-family="sans-serif" font-size="14">Pain is an alarm signal, never something to push through.</text>
    <rect x="104" y="86" width="590" height="38" rx="8" fill="#064E3B" fill-opacity="0.5" stroke="#34D399" stroke-width="1"/>
    <text x="118" y="110" fill="#A7F3D0" font-family="sans-serif" font-size="13" font-weight="700">✓ Stop immediately on discomfort. Clean and thoroughly dry after every use.</text>
  </g>
</svg>