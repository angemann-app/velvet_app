<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Toy Materials Compared</title>
  <desc>Properties, feel, and care for the four core materials</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140D1C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="siliconeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="steelG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="absG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Titelzeile -->
  <text x="400" y="42" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="24" font-weight="700">Toy Materials Compared</text>
  <text x="400" y="68" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="14">Properties, feel, and care for the four core materials</text>

  <!-- Karte 1: Silikon -->
  <g transform="translate(30, 92)">
    <rect width="355" height="230" rx="14" fill="url(#card)" stroke="#FB7185" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="44" cy="44" r="24" fill="url(#siliconeG)"/>
    <path d="M36 38 C42 34 50 38 52 46 C52 52 44 54 38 50 C34 46 32 40 36 38 Z" fill="#FFF" opacity="0.6"/>
    <text x="82" y="38" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">Medical Silicone</text>
    <text x="82" y="58" fill="#FB7185" font-family="sans-serif" font-size="13" font-weight="600">Soft, velvety &amp; body-warm</text>
    <text x="24" y="104" fill="#E2E8F0" font-family="sans-serif" font-size="14">✓ Flexible, contours naturally</text>
    <rect x="20" y="126" width="315" height="84" rx="8" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="32" y="150" fill="#FDE68A" font-family="sans-serif" font-size="13" font-weight="700">⚠ Care Note:</text>
    <text x="32" y="174" fill="#CBD5E1" font-family="sans-serif" font-size="12">Water-based lubricant only! Silicone lube rui</text>
    <text x="32" y="194" fill="#CBD5E1" font-family="sans-serif" font-size="12">ns the surface. Mild soap.</text>
  </g>

  <!-- Karte 2: Glas -->
  <g transform="translate(415, 92)">
    <rect width="355" height="230" rx="14" fill="url(#card)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="44" cy="44" r="24" fill="url(#glassG)"/>
    <path d="M34 52 L54 32 C56 30 56 38 52 44 L36 56 Z" fill="#FFF" opacity="0.75"/>
    <text x="82" y="38" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">Borosilicate Glass</text>
    <text x="82" y="58" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="600">Smooth, firm &amp; non-porous</text>
    <text x="24" y="104" fill="#E2E8F0" font-family="sans-serif" font-size="14">✓ Conducts warm &amp; cold superbly</text>
    <rect x="20" y="126" width="315" height="84" rx="8" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="32" y="150" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700">★ Care Note:</text>
    <text x="32" y="174" fill="#CBD5E1" font-family="sans-serif" font-size="12">Compatible with all lubricants. Boilable and </text>
    <text x="32" y="194" fill="#CBD5E1" font-family="sans-serif" font-size="12">easily sanitized.</text>
  </g>

  <!-- Karte 3: Edelstahl -->
  <g transform="translate(30, 342)">
    <rect width="355" height="230" rx="14" fill="url(#card)" stroke="#94A3B8" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="44" cy="44" r="24" fill="url(#steelG)"/>
    <line x1="28" y1="28" x2="60" y2="60" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <text x="82" y="38" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">Stainless Steel</text>
    <text x="82" y="58" fill="#CBD5E1" font-family="sans-serif" font-size="13" font-weight="600">Cool, weighty &amp; seamless</text>
    <text x="24" y="104" fill="#E2E8F0" font-family="sans-serif" font-size="14">✓ Intense, precise pressure</text>
    <rect x="20" y="126" width="315" height="84" rx="8" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="32" y="150" fill="#CBD5E1" font-family="sans-serif" font-size="13" font-weight="700">★ Care Note:</text>
    <text x="32" y="174" fill="#CBD5E1" font-family="sans-serif" font-size="12">Extremely durable. Warm up in warm water befo</text>
    <text x="32" y="194" fill="#CBD5E1" font-family="sans-serif" font-size="12">re use for comfort.</text>
  </g>

  <!-- Karte 4: ABS -->
  <g transform="translate(415, 342)">
    <rect width="355" height="230" rx="14" fill="url(#card)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="44" cy="44" r="24" fill="url(#absG)"/>
    <circle cx="44" cy="44" r="10" fill="#1E293B"/>
    <line x1="44" y1="36" x2="44" y2="44" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="38" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">Body-Safe ABS Plastic</text>
    <text x="82" y="58" fill="#FBBF24" font-family="sans-serif" font-size="13" font-weight="600">Rigid, smooth &amp; sturdy</text>
    <text x="24" y="104" fill="#E2E8F0" font-family="sans-serif" font-size="14">✓ Transmits vibrations directly</text>
    <rect x="20" y="126" width="315" height="84" rx="8" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="32" y="150" fill="#FDE68A" font-family="sans-serif" font-size="13" font-weight="700">⚠ Care Note:</text>
    <text x="32" y="174" fill="#CBD5E1" font-family="sans-serif" font-size="12">Water-based lube recommended. Keep electronic</text>
    <text x="32" y="194" fill="#CBD5E1" font-family="sans-serif" font-size="12">s out of water.</text>
  </g>
</svg>