<!doctype html>
<!-- Vorlage für das Vorschaubild (1280×640) unter Settings › Social preview.
     Erzeugen: msedge --headless=new --window-size=1280,640 --screenshot=docs/social_preview.png docs/social_preview.html -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 28% 50%, #4a1d3a 0%, #1e1b33 45%, #0f172a 100%);
    font-family: "Segoe UI", Roboto, sans-serif; color: #f8fafc;
    display: flex; align-items: center;
  }
  .art { width: 560px; height: 640px; display: flex; align-items: center; justify-content: center; }
  .art img { width: 520px; border-radius: 28px; box-shadow: 0 30px 80px rgba(244, 63, 94, 0.25); }
  .text { flex: 1; padding-right: 70px; }
  h1 { font-size: 92px; margin: 0 0 18px; letter-spacing: -2px; font-weight: 800; }
  h1 span { color: #f59e0b; }
  p { font-size: 34px; line-height: 1.35; margin: 0 0 28px; color: #cbd5e1; }
  .tags { display: flex; flex-wrap: wrap; gap: 12px; }
  .tags div { font-size: 22px; padding: 8px 18px; border-radius: 999px; border: 2px solid #334155; color: #e2e8f0; }
</style>
</head>
<body>
  <div class="art"><img src="../assets/images/cover_11.svg" alt=""></div>
  <div class="text">
    <h1>Velvet<span>Pulse</span></h1>
    <p>Intimität ohne Leistungsdruck – Kurse, Körperübungen und ein verschlüsselter Paar-Kanal.</p>
    <div class="tags">
      <div>Open Source</div><div>Android</div><div>Ende-zu-Ende-verschlüsselt</div><div>Ohne Konto</div>
    </div>
  </div>
</body>
</html>
