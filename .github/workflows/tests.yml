name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Nur Fehler brechen ab; ältere Warnungen und Stil-Hinweise nicht.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Enthält die Sicherheits-Regressionstests (test/security_test.dart).
      - run: flutter test
      # Rendert alle Screens (build/screens/) und protokolliert Layout-Überläufe; Bilder als Artefakt.
      - run: flutter test test_screens/screens_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: build/screens/
          retention-days: 14
