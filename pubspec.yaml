name: velvetpulse
description: "VelvetPulse - Somatik, KVT & Sinnliche Präsenz"
publish_to: 'none'
version: 4.5.0-beta.1+30

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_tts: ^4.0.2
  google_generative_ai: ^0.4.4
  audioplayers: ^6.1.0
  audio_session: ^0.2.4
  nostr_tools: ^1.0.9
  qr_flutter: ^4.1.0
  mobile_scanner: 5.2.3
  flutter_svg: ^2.0.10+1
  local_auth: ^3.0.2
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  pointycastle: ^3.9.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  android_intent_plus: ^6.1.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  intl: any
  crypto: ^3.0.7
  archive: ^4.5.2
  flutter_webrtc: ^1.6.2+hotfix.4
  image_picker: ^1.2.4
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/velvet_content.json
    - assets/data/paar_abend.json
    - assets/data/selbst_reise.json
    - assets/data/einschlaf_reise.json
    - assets/data/traum_reise.json
    - assets/data/neuigkeiten.json
    - assets/data/anleitung.json
    - assets/data/foto_ideen.json
    # Englische Inhalte (seit 4.5 Teil der App, Sprache je nach Gerät oder Einstellung)
    - translations/en/velvet_content.json
    - translations/en/paar_abend.json
    - translations/en/selbst_reise.json
    - translations/en/einschlaf_reise.json
    - translations/en/traum_reise.json
    - translations/en/neuigkeiten.json
    - translations/en/yes_no_maybe.json
    - translations/en/fantasy_options.json
    - translations/en/anleitung.json
    - translations/en/foto_ideen.json
    - assets/images/
    # Aufnahmen kommen als Pakete nach (lib/services/pakete.dart, tools/pakete_bauen.py). In der App bleiben nur
    # die Ansagen des Beckenboden-Trainings (Deutsch und Englisch), Klangschale, Klangteppich und die Längen der
    # geführten Bausteine (für die Planung auch ohne Paket).
    - assets/audio/cues/
    - assets/audio/cues_en/
    - assets/audio/paar/klangschale.opus
    - assets/audio/paar/klangteppich.opus
    - assets/audio/paar/dauer.json
    - assets/audio/selbst/dauer.json
    - assets/audio/einschlaf/dauer.json
    - assets/audio/traum/dauer.json
