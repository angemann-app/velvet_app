name: velvetpulse
description: "VelvetPulse - Somatik, KVT & Sinnliche Präsenz"
publish_to: 'none'
version: 4.4.0-beta.4+25

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_tts: ^4.0.2
  google_generative_ai: ^0.4.4
  audioplayers: ^6.1.0
  nostr_tools: ^1.0.9
  qr_flutter: ^4.1.0
  mobile_scanner: 5.2.3
  flutter_svg: ^2.0.10+1
  local_auth: ^3.0.2
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  pointycastle: ^3.9.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  crypto: ^3.0.7

flutter:
  uses-material-design: true

  assets:
    - assets/data/velvet_content.json
    - assets/data/paar_abend.json
    - assets/images/
    - assets/audio/
    - assets/audio/cues/
    - assets/audio/paar/
