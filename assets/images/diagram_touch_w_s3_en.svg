<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Depth and Stop</title>
  <desc>Four steps: arousal first, start shallow, depth only on a clear 'more', stop immediately on pain</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140D1C"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <text x="400" y="34" font-family="sans-serif" font-size="24" font-weight="700" fill="#F1F5F9" text-anchor="middle">Depth and Stop</text>
  <text x="400" y="60" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">schematic, position and size vary</text>
  <rect x="26" y="330" width="176" height="120" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#FB7185" stroke-width="2.5"/>
  <circle cx="50" cy="356" r="13" fill="#FB7185"/><text x="50" y="362" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">1</text>
  <text x="38" y="396" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">Arousal</text>
  <text x="38" y="418" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">first</text>
  <rect x="216" y="278" width="176" height="172" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#FB7185" stroke-width="2.5"/>
  <circle cx="240" cy="304" r="13" fill="#FB7185"/><text x="240" y="310" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">2</text>
  <text x="228" y="344" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">Start</text>
  <text x="228" y="366" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">shallow</text>
  <rect x="406" y="226" width="176" height="224" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#FBBF24" stroke-width="2.5"/>
  <circle cx="430" cy="252" r="13" fill="#FBBF24"/><text x="430" y="258" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">3</text>
  <text x="418" y="292" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">Depth only on</text>
  <text x="418" y="314" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">a clear</text>
  <text x="418" y="336" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">“more”</text>
  <rect x="596" y="174" width="176" height="276" rx="12" fill="#7F1D1D" fill-opacity="0.9" stroke="#EF4444" stroke-width="2.5"/>
  <circle cx="620" cy="200" r="13" fill="#FCA5A5"/><text x="620" y="206" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">4</text>
  <text x="608" y="240" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">Pain or pressure</text>
  <text x="608" y="262" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">with discomfort</text>
  <text x="608" y="284" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">means stop</text>
  <text x="608" y="306" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">immediately</text>
  <polygon points="670,336 698,336 718,356 718,384 698,404 670,404 650,384 650,356" fill="#EF4444" stroke="#FEE2E2" stroke-width="2.5"/>
  <rect x="664" y="365" width="40" height="10" rx="3" fill="#FFFFFF"/>
  <rect x="26" y="476" width="748" height="64" rx="14" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="400" y="515" font-family="sans-serif" font-size="20" font-weight="700" fill="#F1F5F9" text-anchor="middle">The person with the cervix decides depth and pace.</text>
</svg>
