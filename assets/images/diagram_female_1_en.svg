<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <title>Female Pelvic Floor: Letting Go</title>
  <desc>Layers of pelvic floor, expansion with abdominal breathing and relaxing muscle slings</desc>
  <rect width="800" height="600" fill="#140D1C"/>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  
  <text x="40" y="48" fill="#F1F5F9" font-family="sans-serif" font-size="24px" font-weight="bold">Female Pelvic Floor: Opening Instead of Holding</text>
  <text x="40" y="78" fill="#94A3B8" font-family="sans-serif" font-size="16px">Three Layers &amp; the Principle of Gentle Yielding</text>

  <!-- Left: 3 Layers -->
  <rect x="40" y="105" width="350" height="430" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="138" fill="#38BDF8" font-family="sans-serif" font-size="18px" font-weight="bold">The Three Muscle Layers</text>

  <!-- Layer 1 -->
  <rect x="60" y="155" width="310" height="90" rx="10" fill="#0F172A" stroke="#FB7185" stroke-width="1.5"/>
  <text x="75" y="180" fill="#FB7185" font-family="sans-serif" font-size="16px" font-weight="bold">1. Outer Sphincter Layer</text>
  <text x="75" y="204" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Encircles vaginal entrance &amp; clitoris.</text>
    <text x="75" y="226" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Prone to vaginismus when overly tense.</text>

  <!-- Layer 2 -->
  <rect x="60" y="255" width="310" height="105" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="75" y="280" fill="#C084FC" font-family="sans-serif" font-size="16px" font-weight="bold">2. Middle Layer</text>
  <text x="75" y="302" fill="#94A3B8" font-family="sans-serif" font-size="16px">(Urogenital Diaphragm)</text>
  <text x="75" y="326" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Triangular elastic muscle sheet.</text>
    <text x="75" y="348" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Stabilizes and elastically buffers.</text>

  <!-- Layer 3 -->
  <rect x="60" y="370" width="310" height="105" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="75" y="395" fill="#34D399" font-family="sans-serif" font-size="16px" font-weight="bold">3. Deep Layer</text>
  <text x="75" y="417" fill="#94A3B8" font-family="sans-serif" font-size="16px">(Levator Ani Sling)</text>
  <text x="75" y="441" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Broad muscle sling deep in pelvis.</text>
    <text x="75" y="463" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Lifts &amp; lowers in sync with breath.</text>

  <text x="60" y="505" fill="#34D399" font-family="sans-serif" font-size="16px">Three elastically interlocked layers</text>

  <!-- Right: Blossom Exercise -->
  <rect x="410" y="105" width="350" height="430" rx="14" fill="#1E1B4B" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="138" fill="#FB7185" font-family="sans-serif" font-size="18px" font-weight="bold">The Blossom Exercise</text>

  <rect x="430" y="155" width="310" height="160" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="445" y="185" fill="#38BDF8" font-family="sans-serif" font-size="17px" font-weight="bold">Inhale: Yielding</text>
  <text x="445" y="215" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Breathe deeply into abdomen.</text>
    <text x="445" y="239" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Imagine vaginal entrance and</text>
    <text x="445" y="263" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">perineum softening and yielding</text>
    <text x="445" y="287" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">gently outward (like a bud).</text>

  <rect x="430" y="330" width="310" height="145" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="445" y="360" fill="#34D399" font-family="sans-serif" font-size="17px" font-weight="bold">Exhale: Staying Soft</text>
  <text x="445" y="390" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">No counter-pressure, no lifting.</text>
    <text x="445" y="414" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Pelvic floor remains relaxed.</text>
    <text x="445" y="438" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Better blood flow &amp; range.</text>

  <text x="430" y="505" fill="#FB7185" font-family="sans-serif" font-size="16px">Pressure closes – Safety opens</text>

  <text x="400" y="570" fill="#94A3B8" font-family="sans-serif" font-size="16px" text-anchor="middle">schematic, position and size vary</text>

</svg>