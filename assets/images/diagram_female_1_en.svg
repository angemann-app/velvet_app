<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <title>Female Pelvic Floor: Letting Go</title>
  <desc>Layers of pelvic floor, expansion with abdominal breathing and relaxing muscle slings</desc>
  <rect width="800" height="600" fill="#140D1C"/>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  
  <!-- Header -->
  <text x="40" y="48" fill="#F1F5F9" font-family="sans-serif" font-size="24px" font-weight="bold">Female Pelvic Floor: Opening Instead of Holding</text>
  <text x="40" y="78" fill="#94A3B8" font-family="sans-serif" font-size="16px">Three Layers &amp; the Principle of Gentle Yielding</text>

  <!-- Left: 3 Layers -->
  <rect x="40" y="105" width="350" height="430" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="140" fill="#38BDF8" font-family="sans-serif" font-size="18px" font-weight="bold">The Three Muscle Layers</text>

  <!-- Layer 1 -->
  <rect x="65" y="160" width="300" height="95" rx="10" fill="#0F172A" stroke="#FB7185" stroke-width="1.5"/>
  <text x="80" y="188" fill="#FB7185" font-family="sans-serif" font-size="16px" font-weight="bold">1. Outer Sphincter Layer</text>
  <text x="80" y="212" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Encircles vaginal entrance and clitoris.</text>
    <text x="80" y="234" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Prone to vaginismus when overly tense.</text>

  <!-- Layer 2 -->
  <rect x="65" y="275" width="300" height="95" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="80" y="303" fill="#C084FC" font-family="sans-serif" font-size="16px" font-weight="bold">2. Middle Layer (Urogenital Diaphragm)</text>
  <text x="80" y="327" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Triangular muscle sheet between sit bones.</text>
    <text x="80" y="349" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Stabilizes and elastically buffers pressure.</text>

  <!-- Layer 3 -->
  <rect x="65" y="390" width="300" height="125" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="80" y="418" fill="#34D399" font-family="sans-serif" font-size="16px" font-weight="bold">3. Deep Layer (Levator Ani)</text>
  <text x="80" y="442" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Broad muscle sling deep in the pelvis.</text>
    <text x="80" y="464" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Lifts and lowers in sync with the diaphragm.</text>

  <!-- Right: Blossom Exercise / Breathing -->
  <rect x="410" y="105" width="350" height="430" rx="14" fill="#1E1B4B" stroke="#334155" stroke-width="1.5"/>
  <text x="435" y="140" fill="#FB7185" font-family="sans-serif" font-size="18px" font-weight="bold">The Blossom Exercise</text>

  <rect x="435" y="160" width="300" height="160" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="450" y="190" fill="#38BDF8" font-family="sans-serif" font-size="17px" font-weight="bold">Inhale: Yielding</text>
  <text x="450" y="220" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Breathe deeply into the abdomen.</text>
    <text x="450" y="244" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Imagine the vaginal entrance and</text>
    <text x="450" y="268" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">perineum softening and expanding</text>
    <text x="450" y="292" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">gently downward (like a blossom).</text>

  <rect x="435" y="340" width="300" height="145" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="450" y="370" fill="#34D399" font-family="sans-serif" font-size="17px" font-weight="bold">Exhale: Staying Soft</text>
  <text x="450" y="400" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">No counter-pressure, no lifting.</text>
    <text x="450" y="424" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">The pelvic floor remains relaxed.</text>
    <text x="450" y="448" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Better blood flow &amp; broader range.</text>

  <text x="435" y="515" fill="#FB7185" font-family="sans-serif" font-size="16px">Pressure closes – Safety opens</text>

  <!-- Footer Notice -->
  <text x="400" y="570" fill="#94A3B8" font-family="sans-serif" font-size="16px" text-anchor="middle">schematic, position and size vary</text>

</svg>