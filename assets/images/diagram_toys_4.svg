<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Sicherheit bei Toys: Wo es heikel wird</title>
  <desc>Drei Grundregeln für unbeschwerte und sichere Nutzung</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140D1C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Titelzeile -->
  <text x="400" y="40" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="22" font-weight="700">Sicherheit bei Toys: Wo es heikel wird</text>
  <text x="400" y="64" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="16">Drei Grundregeln für unbeschwerte und sichere Nutzung</text>

  <!-- Regel 1: Anal-Sicherheit (Rot) -->
  <g transform="translate(30, 88)">
    <rect width="740" height="146" rx="14" fill="url(#card)" stroke="#F43F5E" stroke-width="1.8"/>
    <circle cx="56" cy="73" r="28" fill="url(#redGrad)"/>
    <path d="M56 52 C50 52 48 60 50 66 L42 68 C38 68 38 74 42 74 L70 74 C74 74 74 68 70 68 L62 66 C64 60 62 52 56 52 Z" fill="#FFF"/>
    <line x1="38" y1="76" x2="74" y2="76" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="104" y="40" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">1. Anal-Sicherheit: Breite Basis ist Pflicht</text>
    <text x="104" y="66" fill="#CBD5E1" font-family="sans-serif" font-size="16">Der Enddarm hat keinen Boden. Toys ohne breiten Fuß können hineingleiten.</text>
    <rect x="104" y="84" width="616" height="42" rx="8" fill="#881337" fill-opacity="0.55" stroke="#F43F5E" stroke-width="1"/>
    <text x="120" y="111" fill="#FDA4AF" font-family="sans-serif" font-size="16" font-weight="700">✓ IMMER: Breiter Griff oder Flansch, der sicher draußen bleibt.</text>
  </g>

  <!-- Regel 2: Gleitmittel (Gelb) -->
  <g transform="translate(30, 252)">
    <rect width="740" height="146" rx="14" fill="url(#card)" stroke="#FBBF24" stroke-width="1.8"/>
    <circle cx="56" cy="73" r="28" fill="url(#amberGrad)"/>
    <path d="M56 52 C56 52 44 66 44 76 C44 82 49 87 56 87 C63 87 68 82 68 76 C68 66 56 52 56 52 Z" fill="#FFF"/>
    
    <text x="104" y="40" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">2. Gleitmittel: Passend zum Material</text>
    <text x="104" y="66" fill="#CBD5E1" font-family="sans-serif" font-size="16">Falsches Gel greift Oberflächen an oder führt zu Schleimhautreizung.</text>
    <rect x="104" y="84" width="616" height="42" rx="8" fill="#78350F" fill-opacity="0.55" stroke="#FBBF24" stroke-width="1"/>
    <text x="120" y="111" fill="#FDE68A" font-family="sans-serif" font-size="16" font-weight="700">✓ Silikon-Toys NUR mit Wasserbasis. Silikongel löst Silikon-Toys auf.</text>
  </g>

  <!-- Regel 3: Stopp-Signale & Hygiene (Grün) -->
  <g transform="translate(30, 416)">
    <rect width="740" height="146" rx="14" fill="url(#card)" stroke="#34D399" stroke-width="1.8"/>
    <circle cx="56" cy="73" r="28" fill="url(#greenGrad)"/>
    <path d="M46 66 L46 58 C46 56 48 56 48 58 L48 66 M50 66 L50 54 C50 52 52 52 52 54 L52 66 M54 66 L54 56 C54 54 56 54 56 56 L56 66 M58 66 L58 60 C58 58 60 58 60 60 L60 70 C60 78 56 84 48 84 C44 84 42 80 42 74 L42 68" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>

    <text x="104" y="40" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">3. Stopp-Signale &amp; Hygiene: Auf den Körper hören</text>
    <text x="104" y="66" fill="#CBD5E1" font-family="sans-serif" font-size="16">Schmerz ist ein Alarmsignal, kein Reiz, durch den man durch muss.</text>
    <rect x="104" y="84" width="616" height="42" rx="8" fill="#064E3B" fill-opacity="0.55" stroke="#34D399" stroke-width="1"/>
    <text x="120" y="111" fill="#A7F3D0" font-family="sans-serif" font-size="16" font-weight="700">✓ Bei Schmerz sofort anhalten. Nach jedem Gebrauch reinigen &amp; trocknen.</text>
  </g>
</svg>