<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <title>Positionen für Ausdauer und Erektion</title>
  <desc>Geometrische Entlastung, Gewichtsabgabe an die Unterlage und Reduktion von Beckenspannung</desc>
  <rect width="800" height="600" fill="#140D1C"/>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  
  <!-- Header -->
  <text x="40" y="48" fill="#F1F5F9" font-family="sans-serif" font-size="24px" font-weight="bold">Ausdauer &amp; Erektion: Entlastende Positionen</text>
  <text x="40" y="78" fill="#94A3B8" font-family="sans-serif" font-size="16px">Gewichtsabgabe, ruhiger Atem &amp; weicher Beckenboden</text>

  <!-- 3 Position Cards -->
  <!-- Pos 1 -->
  <rect x="40" y="105" width="230" height="305" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="65" cy="138" r="14" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2"/>
  <text x="65" y="144" fill="#38BDF8" font-family="sans-serif" font-size="16px" font-weight="bold" text-anchor="middle">A</text>
  <text x="90" y="144" fill="#F1F5F9" font-family="sans-serif" font-size="17px" font-weight="bold">Löffelchen</text>
  <text x="60" y="185" fill="#94A3B8" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Niemand muss Gewicht im Liegestütz halten.</text>
    <text x="60" y="210" fill="#94A3B8" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Bauch, Po &amp; Beckenboden bleiben weich.</text>
    <text x="60" y="235" fill="#94A3B8" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Seitlicher Winkel schont die Eichel; freie Hände.</text>

  <!-- Pos 2 -->
  <rect x="285" y="105" width="230" height="305" rx="12" fill="#1E293B" stroke="#C084FC" stroke-width="1.5"/>
  <circle cx="310" cy="138" r="14" fill="#C084FC" fill-opacity="0.2" stroke="#C084FC" stroke-width="2"/>
  <text x="310" y="144" fill="#C084FC" font-family="sans-serif" font-size="16px" font-weight="bold" text-anchor="middle">B</text>
  <text x="335" y="144" fill="#F1F5F9" font-family="sans-serif" font-size="17px" font-weight="bold">Lehnen (oben)</text>
  <text x="305" y="185" fill="#94A3B8" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Oberkörper lehnt weit auf seine Brust.</text>
    <text x="305" y="210" fill="#94A3B8" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Waagerechtes Reiben statt Auf-und-Ab.</text>
    <text x="305" y="235" fill="#94A3B8" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Er hat keine Stützlast und kann tief atmen.</text>

  <!-- Pos 3 -->
  <rect x="530" y="105" width="230" height="305" rx="12" fill="#1E293B" stroke="#FB7185" stroke-width="1.5"/>
  <circle cx="555" cy="138" r="14" fill="#FB7185" fill-opacity="0.2" stroke="#FB7185" stroke-width="2"/>
  <text x="555" y="144" fill="#FB7185" font-family="sans-serif" font-size="16px" font-weight="bold" text-anchor="middle">C</text>
  <text x="580" y="144" fill="#FB7185" font-family="sans-serif" font-size="17px" font-weight="bold">Kissenkeil</text>
  <text x="550" y="185" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Festes Kissen unter ihrem Gesäß hebt das Becken.</text>
    <text x="550" y="210" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Er kniet aufrecht und steuert den Winkel.</text>
    <text x="550" y="235" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Führt sanft zur vorderen Vaginalwand.</text>

  <!-- Bottom Principle Card -->
  <rect x="40" y="425" width="720" height="110" rx="12" fill="#1E1B4B" stroke="#34D399" stroke-width="1.5"/>
  <text x="65" y="458" fill="#34D399" font-family="sans-serif" font-size="18px" font-weight="bold">Körpermechanischer Grundsatz</text>
  <text x="65" y="488" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Hohe Muskelanspannung in Beinen und Rumpf beschleunigt den Samenerguss.</text>
    <text x="65" y="514" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Positionen mit Gewichtsabgabe an die Unterlage schenken Ruhe und Ausdauer.</text>

  <!-- Footer Notice -->
  <text x="400" y="570" fill="#94A3B8" font-family="sans-serif" font-size="16px" text-anchor="middle">schematisch, Lage und Größe sind individuell</text>

</svg>