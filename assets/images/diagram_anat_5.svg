<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Deine eigene Landkarte</title>
  <desc>Neutrale Tabelle mit Körperzonen als Zeilen und drei Spalten für gern, vielleicht und lieber nicht, markiert mit farbigen Punkten.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#140D1C"/>
  <ellipse cx="400" cy="320" rx="350" ry="235" fill="url(#glow)"/>

  <text x="400" y="50" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="31" font-weight="700">Deine eigene Landkarte</text>
  <text x="400" y="84" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="20" font-weight="700">Zonen und drei Antworten</text>
  <text x="400" y="116" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="18">Eine Vorlage für angenehme Berührung</text>

  <rect x="110" y="168" width="580" height="44" fill="#241830"/>
  <circle cx="395" cy="181" r="5" fill="#34D399"/>
  <circle cx="520" cy="181" r="5" fill="#FBBF24"/>
  <circle cx="635" cy="181" r="5" fill="#FB7185"/>
  <text x="125" y="203" fill="#94A3B8" font-family="sans-serif" font-size="17" font-weight="700">Zone</text>
  <text x="395" y="203" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="17" font-weight="700">gern</text>
  <text x="520" y="203" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="17" font-weight="700">vielleicht</text>
  <text x="635" y="203" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="16" font-weight="700">lieber nicht</text>

  <rect x="110" y="212" width="580" height="44" fill="#1C1327"/>
  <rect x="110" y="256" width="580" height="44" fill="#181021"/>
  <rect x="110" y="300" width="580" height="44" fill="#1C1327"/>
  <rect x="110" y="344" width="580" height="44" fill="#181021"/>
  <rect x="110" y="388" width="580" height="44" fill="#1C1327"/>
  <rect x="110" y="432" width="580" height="44" fill="#181021"/>

  <g stroke="#64748B" stroke-width="1.5" stroke-opacity="0.55">
    <line x1="110" y1="212" x2="690" y2="212"/>
    <line x1="110" y1="256" x2="690" y2="256"/>
    <line x1="110" y1="300" x2="690" y2="300"/>
    <line x1="110" y1="344" x2="690" y2="344"/>
    <line x1="110" y1="388" x2="690" y2="388"/>
    <line x1="110" y1="432" x2="690" y2="432"/>
    <line x1="110" y1="476" x2="690" y2="476"/>
    <line x1="330" y1="168" x2="330" y2="476"/>
    <line x1="460" y1="168" x2="460" y2="476"/>
    <line x1="580" y1="168" x2="580" y2="476"/>
  </g>
  <rect x="110" y="168" width="580" height="308" fill="none" stroke="#64748B" stroke-width="2"/>

  <text x="128" y="240" fill="#F1F5F9" font-family="sans-serif" font-size="17">Nacken</text>
  <text x="128" y="284" fill="#F1F5F9" font-family="sans-serif" font-size="17">Rücken</text>
  <text x="128" y="328" fill="#F1F5F9" font-family="sans-serif" font-size="17">Bauch</text>
  <text x="128" y="372" fill="#F1F5F9" font-family="sans-serif" font-size="17">Oberschenkel</text>
  <text x="128" y="416" fill="#F1F5F9" font-family="sans-serif" font-size="17">Füße</text>
  <text x="128" y="460" fill="#F1F5F9" font-family="sans-serif" font-size="17">Hände</text>

  <circle cx="395" cy="234" r="9" fill="#34D399"/>
  <circle cx="520" cy="234" r="9" fill="none" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="635" cy="234" r="9" fill="none" stroke="#FB7185" stroke-width="2" stroke-opacity="0.7"/>

  <circle cx="395" cy="278" r="9" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="520" cy="278" r="9" fill="#FBBF24"/>
  <circle cx="635" cy="278" r="9" fill="none" stroke="#FB7185" stroke-width="2" stroke-opacity="0.7"/>

  <circle cx="395" cy="322" r="9" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="520" cy="322" r="9" fill="none" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="635" cy="322" r="9" fill="none" stroke="#FB7185" stroke-width="2" stroke-opacity="0.7"/>

  <circle cx="395" cy="366" r="9" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="520" cy="366" r="9" fill="none" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="635" cy="366" r="9" fill="none" stroke="#FB7185" stroke-width="2" stroke-opacity="0.7"/>

  <circle cx="395" cy="410" r="9" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="520" cy="410" r="9" fill="none" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="635" cy="410" r="9" fill="#FB7185"/>

  <circle cx="395" cy="454" r="9" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="520" cy="454" r="9" fill="none" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="635" cy="454" r="9" fill="none" stroke="#FB7185" stroke-width="2" stroke-opacity="0.7"/>

  <text x="400" y="506" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="17">Ein Punkt pro Zone – die Karte darf sich ändern.</text>

  <text x="400" y="540" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="20">Jede Zone bekommt eine Antwort: gern, vielleicht oder lieber nicht.</text>
  <text x="400" y="566" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="18">Die Karte ist eine Einladung, kein Vertrag – heute darf anders sein.</text>
  <text x="400" y="590" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="18">Mit dem Gegenüber getauscht wird daraus ein liebevolles Gespräch.</text>
</svg>
