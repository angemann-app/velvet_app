<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140D1C"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2AA92"/>
      <stop offset="1" stop-color="#C98A74"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9687A"/>
      <stop offset="1" stop-color="#A84C60"/>
    </linearGradient>
    <radialGradient id="mons" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#E2AA92" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#E2AA92" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="300" rx="260" ry="270" fill="url(#glow)"/>

  <!-- Zifferblatt -->
  <circle cx="400" cy="300" r="225" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 10" opacity="0.55"/>
  <text x="400" y="62" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="26" font-weight="700">12</text>
  <text x="400" y="560" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="26" font-weight="700">6</text>
  <text x="648" y="309" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="22">3</text>
  <text x="152" y="309" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="22">9</text>

  <!-- Venushügel -->
  <ellipse cx="400" cy="150" rx="170" ry="95" fill="url(#mons)"/>

  <!-- Äußere Schamlippen -->
  <path d="M400 105 C318 110 282 190 288 295 C294 395 344 462 400 474 C456 462 506 395 512 295 C518 190 482 110 400 105 Z"
        fill="url(#skin)" stroke="#8C5546" stroke-width="2.5"/>

  <!-- Innere Schamlippen -->
  <path d="M400 150 C376 166 362 200 366 232 C370 258 352 288 362 322 C370 356 384 396 400 414
           C416 396 430 356 438 322 C448 288 430 258 434 232 C438 200 424 166 400 150 Z"
        fill="url(#inner)" stroke="#7E3346" stroke-width="2.5"/>

  <!-- Vorhof -->
  <path d="M400 214 C386 232 380 280 382 330 C384 368 392 392 400 398 C408 392 416 368 418 330 C420 280 414 232 400 214 Z"
        fill="#8A3449"/>

  <!-- Klitorisvorhaut und Klitoris -->
  <path d="M374 196 C374 160 426 160 426 196 C414 184 386 184 374 196 Z" fill="#B85A6D" stroke="#7E3346" stroke-width="2"/>
  <circle cx="400" cy="200" r="8" fill="#F4A6B4" stroke="#7E3346" stroke-width="1.5"/>

  <!-- Harnröhre und Vaginaleingang -->
  <ellipse cx="400" cy="270" rx="3" ry="5" fill="#4A1A27"/>
  <ellipse cx="400" cy="345" rx="13" ry="28" fill="#4A1A27"/>

  <!-- Damm und After -->
  <path d="M400 474 L400 520" stroke="#8C5546" stroke-width="2" stroke-dasharray="3 5"/>
  <circle cx="400" cy="532" r="8" fill="#9A6656" stroke="#6E4034" stroke-width="2"/>

  <!-- Innere Klitoris: Schenkel und Schwellkörper (verborgen, gestrichelt) -->
  <g fill="none" stroke="#FDE68A" stroke-width="3" stroke-dasharray="7 6" opacity="0.9">
    <path d="M396 206 C372 222 334 262 318 330"/>
    <path d="M404 206 C428 222 466 262 482 330"/>
    <path d="M390 236 C350 252 338 330 370 382 C384 400 396 386 394 362"/>
    <path d="M410 236 C450 252 462 330 430 382 C416 400 404 386 406 362"/>
  </g>

  <!-- Daumenstriche von 12 nach 6 Uhr -->
  <g fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round">
    <path d="M330 150 C276 220 270 370 338 452"/>
    <path d="M470 150 C524 220 530 370 462 452"/>
  </g>
  <polygon points="338,470 324,444 350,446" fill="#FBBF24"/>
  <polygon points="462,470 476,444 450,446" fill="#FBBF24"/>

  <!-- Kreis um die Klitorisvorhaut -->
  <circle cx="400" cy="192" r="34" fill="none" stroke="#FB7185" stroke-width="4" stroke-dasharray="10 7"/>

  <!-- Nummern -->
  <g font-family="sans-serif" font-size="24" font-weight="800" text-anchor="middle">
    <circle cx="214" cy="300" r="22" fill="#FBBF24"/><text x="214" y="309" fill="#1A1224">1</text>
    <circle cx="456" cy="168" r="22" fill="#FB7185"/><text x="456" y="177" fill="#1A1224">2</text>
    <circle cx="548" cy="390" r="22" fill="#FDE68A"/><text x="548" y="399" fill="#1A1224">3</text>
  </g>
  <path d="M414 345 L452 345" stroke="#34D399" stroke-width="3"/>
  <circle cx="470" cy="345" r="20" fill="#34D399"/>
  <text x="470" y="354" fill="#1A1224" font-family="sans-serif" font-size="24" font-weight="800" text-anchor="middle">4</text>

  <!-- Legende links -->
  <g font-family="sans-serif" fill="#F1F5F9">
    <text x="24" y="120" font-size="24" font-weight="800" fill="#FBBF24">1  Daumen</text>
    <text x="24" y="150" font-size="21">von 12 nach 6 Uhr</text>
    <text x="24" y="176" font-size="21">über die äußeren</text>
    <text x="24" y="202" font-size="21">Schamlippen</text>

    <text x="24" y="430" font-size="24" font-weight="800" fill="#FB7185">2  Vorhaut</text>
    <text x="24" y="460" font-size="21">flach umkreisen,</text>
    <text x="24" y="486" font-size="21">Spitze aussparen</text>
  </g>

  <!-- Legende rechts -->
  <g font-family="sans-serif" fill="#F1F5F9">
    <text x="580" y="120" font-size="24" font-weight="800" fill="#FDE68A">3  Verborgen</text>
    <text x="580" y="150" font-size="21">Schwellkörper</text>
    <text x="580" y="176" font-size="21">unter den Lippen:</text>
    <text x="580" y="202" font-size="21">sanft kneten</text>

    <text x="580" y="430" font-size="24" font-weight="800" fill="#34D399">4  Innen</text>
    <text x="580" y="460" font-size="21">nur nach einem Ja:</text>
    <text x="580" y="486" font-size="21">Finger zum Nabel,</text>
    <text x="580" y="512" font-size="21">Komm-her-Geste</text>
  </g>
</svg>
