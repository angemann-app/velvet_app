<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Relax Instead of Pushing</title>
  <desc>Five-step flow: take time, arouse externally, pressure at the front wall, notice the urge to pee, decide</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140D1C"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <text x="400" y="34" font-family="sans-serif" font-size="24" font-weight="700" fill="#F1F5F9" text-anchor="middle">Relax Instead of Pushing</text>
  <text x="400" y="60" font-family="sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">schematic, position and size vary</text>
  <rect x="26" y="110" width="136" height="270" rx="14" fill="#1E293B" fill-opacity="0.7" stroke="#FB7185" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="48" cy="134" r="13" fill="#FBBF24"/><text x="48" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">1</text>
  <g transform="translate(94 206)"><circle cx="0" cy="0" r="26" fill="none" stroke="#FBBF24" stroke-width="4"/><path d="M0 -14 L0 0 L12 8" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/></g>
  <text x="94" y="276" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">Take your</text>
  <text x="94" y="300" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">time</text>
  <polygon points="0,-9 14,0 0,9" fill="#FBBF24" transform="translate(164 245)"/>
  <rect x="179" y="110" width="136" height="270" rx="14" fill="#1E293B" fill-opacity="0.7" stroke="#FB7185" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="201" cy="134" r="13" fill="#FBBF24"/><text x="201" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">2</text>
  <g transform="translate(247 206)"><circle cx="0" cy="0" r="8" fill="#FB7185"/><circle cx="0" cy="0" r="18" fill="none" stroke="#FB7185" stroke-width="3" opacity="0.8"/><circle cx="0" cy="0" r="28" fill="none" stroke="#FB7185" stroke-width="2.5" opacity="0.5"/></g>
  <text x="247" y="276" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">Arouse</text>
  <text x="247" y="300" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">externally</text>
  <polygon points="0,-9 14,0 0,9" fill="#FBBF24" transform="translate(317 245)"/>
  <rect x="332" y="110" width="136" height="270" rx="14" fill="#1E293B" fill-opacity="0.7" stroke="#FB7185" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="354" cy="134" r="13" fill="#FBBF24"/><text x="354" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">3</text>
  <g transform="translate(400 206)"><path d="M-24 18 C-24 -10 -4 -26 24 -26" fill="none" stroke="#A78BFA" stroke-width="6" stroke-linecap="round"/><path d="M-30 4 L-14 4" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/><polygon points="0,-8 16,0 0,8" fill="#FBBF24" transform="translate(-10 4)"/></g>
  <text x="400" y="276" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">Pressure at</text>
  <text x="400" y="300" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">the front wall</text>
  <polygon points="0,-9 14,0 0,9" fill="#FBBF24" transform="translate(470 245)"/>
  <rect x="485" y="110" width="136" height="270" rx="14" fill="#1E293B" fill-opacity="0.7" stroke="#FB7185" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="507" cy="134" r="13" fill="#FBBF24"/><text x="507" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">4</text>
  <g transform="translate(553 206)"><path d="M0 -26 C0 -26 -18 -2 -18 10 C-18 21 -10 28 0 28 C10 28 18 21 18 10 C18 -2 0 -26 0 -26 Z" fill="#38BDF8"/></g>
  <text x="553" y="276" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">Notice the</text>
  <text x="553" y="300" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">urge to pee</text>
  <polygon points="0,-9 14,0 0,9" fill="#FBBF24" transform="translate(623 245)"/>
  <rect x="638" y="110" width="136" height="270" rx="14" fill="#1E293B" fill-opacity="0.7" stroke="#FB7185" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="660" cy="134" r="13" fill="#FBBF24"/><text x="660" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">5</text>
  <g transform="translate(706 206)"><path d="M0 26 L0 0 M0 0 L-20 -22 M0 0 L20 -22" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="706" y="276" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">Decide: let it</text>
  <text x="706" y="300" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">flow on a pad</text>
  <text x="706" y="324" font-family="sans-serif" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">or pause</text>
  <rect x="26" y="420" width="748" height="70" rx="14" fill="#B91C1C" fill-opacity="0.85" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="400" y="463" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pain, burning or discomfort mean stop.</text>
</svg>
