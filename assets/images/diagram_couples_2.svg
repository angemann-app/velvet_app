<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Gemeinsam atmen: zwei Wellen im Takt</title>
  <desc>Zwei synchrone Sinuswellen übereinander: Einatmen über vier Sekunden, Ausatmen über sechs Sekunden. Der gemeinsame Atem wird zum ruhigen Rhythmus.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="#140D1C"/>
  <ellipse cx="400" cy="320" rx="350" ry="235" fill="url(#glow)"/>

  <text x="400" y="50" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="34" font-weight="700">Gemeinsam atmen: zwei Wellen im Takt</text>
  <text x="400" y="84" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="20" font-weight="700">Vier Sekunden ein, sechs Sekunden aus</text>
  <text x="400" y="116" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="18">Bauch an Bauch wird der Atem zum gemeinsamen Rhythmus</text>

  <!-- Mittellinie -->
  <line x1="88" y1="330" x2="728" y2="330" stroke="#334155" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="58" y="330" transform="rotate(-90 58 330)" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="16">Atem</text>

  <!-- Welle 1 -->
  <path d="M100 330 C120 210 160 205 200 330 C240 455 310 455 350 330 C370 210 410 205 450 330 C490 455 560 455 600 330 C620 210 660 205 700 330" fill="none" stroke="#FB7185" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Welle 2 -->
  <path d="M108 330 C128 210 168 205 208 330 C248 455 318 455 358 330 C378 210 418 205 458 330 C498 455 568 455 608 330 C628 210 668 205 708 330" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 6"/>

  <text x="150" y="212" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">Einatmen</text>
  <text x="275" y="452" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="18" font-weight="700">Ausatmen</text>

  <!-- Dauer -->
  <path d="M100 469 L100 479 L200 479 L200 469" fill="none" stroke="#64748B" stroke-width="2"/>
  <text x="150" y="500" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="16">4 s</text>
  <path d="M200 469 L200 479 L350 479 L350 469" fill="none" stroke="#64748B" stroke-width="2"/>
  <text x="275" y="500" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="16">6 s</text>

  <!-- Legende -->
  <line x1="520" y1="158" x2="560" y2="158" stroke="#FB7185" stroke-width="4" stroke-linecap="round"/>
  <text x="568" y="164" fill="#F1F5F9" font-family="sans-serif" font-size="16">Welle 1</text>
  <line x1="520" y1="184" x2="560" y2="184" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 6"/>
  <text x="568" y="190" fill="#F1F5F9" font-family="sans-serif" font-size="16">Welle 2</text>

  <text x="400" y="540" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="20">Ein langsamer Atem mit langem Ausatmen beruhigt das Nervensystem.</text>
  <text x="400" y="566" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="18">Hautkontakt und Wärme signalisieren beiden Sicherheit.</text>
  <text x="400" y="590" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="18">Drei Minuten genügen – danach liegen bleiben, reden oder schlafen.</text>
</svg>
