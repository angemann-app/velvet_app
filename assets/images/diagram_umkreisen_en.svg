<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140D1C"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2AA92"/>
      <stop offset="1" stop-color="#C98A74"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9687A"/>
      <stop offset="1" stop-color="#A84C60"/>
    </linearGradient>
    <radialGradient id="mons" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#E2AA92" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#E2AA92" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Linke Hälfte: Vulva mit Umlaufbahnen -->
  <g transform="translate(-60 30) scale(0.86)">
    <ellipse cx="400" cy="150" rx="170" ry="95" fill="url(#mons)"/>
    <path d="M400 105 C318 110 282 190 288 295 C294 395 344 462 400 474 C456 462 506 395 512 295 C518 190 482 110 400 105 Z"
          fill="url(#skin)" stroke="#8C5546" stroke-width="2.5"/>
    <path d="M400 150 C376 166 362 200 366 232 C370 258 352 288 362 322 C370 356 384 396 400 414
             C416 396 430 356 438 322 C448 288 430 258 434 232 C438 200 424 166 400 150 Z"
          fill="url(#inner)" stroke="#7E3346" stroke-width="2.5"/>
    <path d="M400 214 C386 232 380 280 382 330 C384 368 392 392 400 398 C408 392 416 368 418 330 C420 280 414 232 400 214 Z" fill="#8A3449"/>
    <path d="M374 196 C374 160 426 160 426 196 C414 184 386 184 374 196 Z" fill="#B85A6D" stroke="#7E3346" stroke-width="2"/>
    <circle cx="400" cy="200" r="8" fill="#F4A6B4" stroke="#7E3346" stroke-width="1.5"/>
    <ellipse cx="400" cy="345" rx="13" ry="28" fill="#4A1A27"/>

    <!-- Umlaufbahnen -->
    <circle cx="400" cy="210" r="70" fill="none" stroke="#FBBF24" stroke-width="5" stroke-dasharray="14 9"/>
    <ellipse cx="400" cy="250" rx="150" ry="190" fill="none" stroke="#FBBF24" stroke-width="4" stroke-dasharray="14 9" opacity="0.7"/>
    <polygon points="470,196 458,222 484,220" fill="#FBBF24"/>
    <polygon points="250,262 238,236 264,238" fill="#FBBF24"/>
  </g>
  <text x="284" y="566" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="24" font-weight="800">1  Wide circles first</text>

  <!-- Rechte Hälfte: Finger im Vergleich -->
  <line x1="560" y1="80" x2="560" y2="540" stroke="#334155" stroke-width="2"/>

  <!-- Spitz -->
  <text x="680" y="90" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="24" font-weight="800">pointed</text>
  <path d="M600 250 C640 238 720 238 760 250" fill="none" stroke="#C98A74" stroke-width="6" stroke-linecap="round"/>
  <path d="M680 120 L680 236" stroke="#E2AA92" stroke-width="26" stroke-linecap="round"/>
  <circle cx="680" cy="244" r="9" fill="#FB7185"/>
  <text x="680" y="290" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="21">pinpoint, harsh</text>

  <!-- Flach -->
  <text x="680" y="350" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="24" font-weight="800">2  flat</text>
  <path d="M600 470 C640 458 720 458 760 470" fill="none" stroke="#C98A74" stroke-width="6" stroke-linecap="round"/>
  <path d="M600 400 C640 420 690 446 740 456" stroke="#E2AA92" stroke-width="26" stroke-linecap="round" fill="none"/>
  <ellipse cx="690" cy="462" rx="56" ry="9" fill="#34D399" opacity="0.6"/>
  <text x="680" y="510" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="21">broad, full, safe</text>
</svg>
