<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#16121F"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.6" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <text x="40" y="58" fill="#F1F5F9" font-family="sans-serif" font-size="30" font-weight="800">Waves instead of a sprint</text>

  <!-- Achsen -->
  <line x1="90" y1="100" x2="90" y2="500" stroke="#475569" stroke-width="2"/>
  <line x1="90" y1="500" x2="770" y2="500" stroke="#475569" stroke-width="2"/>
  <g font-family="sans-serif" font-size="22" fill="#94A3B8" text-anchor="end">
    <text x="78" y="128">10</text>
    <text x="78" y="208">8</text>
    <text x="78" y="288">6</text>
    <text x="78" y="368">4</text>
    <text x="78" y="508">0</text>
  </g>
  <text x="430" y="545" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="22">Time</text>

  <!-- Punkt ohne Rückkehr -->
  <line x1="90" y1="160" x2="770" y2="160" stroke="#FB7185" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="310" y="148" fill="#FB7185" font-family="sans-serif" font-size="21">from here the reflex runs by itself</text>

  <!-- Surf-Zone um Stufe 7 -->
  <rect x="90" y="200" width="680" height="60" fill="#FBBF24" opacity="0.14"/>
  <text x="104" y="238" fill="#FBBF24" font-family="sans-serif" font-size="22" font-weight="700">Surf zone around 7</text>

  <!-- Sprint (gestrichelt) -->
  <path d="M92 498 C160 420 200 260 230 150 C240 118 252 118 262 160 C276 230 286 380 300 470"
        fill="none" stroke="#94A3B8" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="206" y="104" fill="#94A3B8" font-family="sans-serif" font-size="21">Sprint</text>

  <!-- Wellen -->
  <path d="M92 498 C180 440 250 300 330 228 C370 196 400 212 430 262 C450 294 470 296 500 252
           C530 208 560 206 590 258 C610 292 630 290 660 240 C690 190 720 140 760 126"
        fill="none" stroke="url(#wave)" stroke-width="7" stroke-linecap="round"/>

  <!-- Pausen markieren -->
  <g fill="#34D399">
    <circle cx="440" cy="276" r="10"/>
    <circle cx="600" cy="272" r="10"/>
  </g>
  <text x="520" y="350" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="22" font-weight="700">Pause: stay still,</text>
  <text x="520" y="378" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="22" font-weight="700">breathe deeply, soft pelvis</text>
</svg>
