<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>The Cycle and Phases of Desire</title>
  <desc>Four cycle phases: estrogen and progesterone curves and desire patterns</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140D1C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">The Cycle and Phases of Desire</text>
  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94A3B8">schematic, position and size vary</text>

  <!-- Hormonkurven Verlauf -->
  <g transform="translate(30, 84)">
    <rect width="740" height="150" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
    
    <!-- Achse & Tagesmarken -->
    <line x1="50" y1="115" x2="700" y2="115" stroke="#475569" stroke-width="1.5"/>
    <text x="50" y="136" font-family="sans-serif" font-size="16" fill="#94A3B8">Day 1</text>
    <text x="210" y="136" font-family="sans-serif" font-size="16" fill="#94A3B8">Day 7</text>
    <text x="360" y="136" font-family="sans-serif" font-size="16" fill="#FB7185" font-weight="700">Day 14 (Ovulation)</text>
    <text x="540" y="136" font-family="sans-serif" font-size="16" fill="#94A3B8">Day 21</text>
    <text x="690" y="136" text-anchor="end" font-family="sans-serif" font-size="16" fill="#94A3B8">Day 28</text>

    <!-- Phasengrenzen gestrichelt -->
    <line x1="140" y1="15" x2="140" y2="115" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="330" y1="15" x2="330" y2="115" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="430" y1="15" x2="430" y2="115" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>

    <!-- Estrogen Kurve (Pink) -->
    <path d="M50 100 C120 100 240 70 375 28 C410 65 440 85 530 65 C600 50 650 95 690 110" fill="none" stroke="#FB7185" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Progesteron Kurve (Gold) -->
    <path d="M50 110 L350 110 C390 110 430 50 530 45 C600 40 650 85 690 110" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>

    <!-- Kurven-Legende -->
    <line x1="60" y1="26" x2="95" y2="26" stroke="#FB7185" stroke-width="3.5"/>
    <text x="105" y="31" font-family="sans-serif" font-size="16" font-weight="700" fill="#FB7185">Estrogen</text>

    <line x1="220" y1="26" x2="255" y2="26" stroke="#FBBF24" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="265" y="31" font-family="sans-serif" font-size="16" font-weight="700" fill="#FBBF24">Progesterone</text>
  </g>

  <!-- 4 Phasen Karten (2x2 Grid) -->
  <g transform="translate(30, 246)">
    <rect width="360" height="104" rx="10" fill="url(#card)" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="16" y="26" font-family="sans-serif" font-size="16" font-weight="700" fill="#94A3B8">Phase 1: Menstruation (Days 1–5)</text>
    <text x="16" y="48" font-family="sans-serif" font-size="16" fill="#F1F5F9">Hormones at baseline.</text>
    <text x="16" y="70" font-family="sans-serif" font-size="16" fill="#F1F5F9">Need for rest and quiet;</text>
    <text x="16" y="92" font-family="sans-serif" font-size="16" fill="#94A3B8">subtle physical sensitivity.</text>
  </g>

  <g transform="translate(410, 246)">
    <rect width="360" height="104" rx="10" fill="url(#card)" stroke="#38BDF8" stroke-width="1.6"/>
    <text x="16" y="26" font-family="sans-serif" font-size="16" font-weight="700" fill="#38BDF8">Phase 2: Follicular (Days 6–12)</text>
    <text x="16" y="48" font-family="sans-serif" font-size="16" fill="#F1F5F9">Estrogen rises steadily.</text>
    <text x="16" y="70" font-family="sans-serif" font-size="16" fill="#F1F5F9">Rise in physical energy,</text>
    <text x="16" y="92" font-family="sans-serif" font-size="16" fill="#94A3B8">curiosity, and initiative.</text>
  </g>

  <g transform="translate(30, 360)">
    <rect width="360" height="104" rx="10" fill="url(#card)" stroke="#FB7185" stroke-width="1.6"/>
    <text x="16" y="26" font-family="sans-serif" font-size="16" font-weight="700" fill="#FB7185">Phase 3: Ovulation (Days 13–16)</text>
    <text x="16" y="48" font-family="sans-serif" font-size="16" fill="#F1F5F9">Estrogen reaches its peak.</text>
    <text x="16" y="70" font-family="sans-serif" font-size="16" fill="#F1F5F9">Highest desire and</text>
    <text x="16" y="92" font-family="sans-serif" font-size="16" fill="#94A3B8">increased natural lubrication.</text>
  </g>

  <g transform="translate(410, 360)">
    <rect width="360" height="104" rx="10" fill="url(#card)" stroke="#FBBF24" stroke-width="1.6"/>
    <text x="16" y="26" font-family="sans-serif" font-size="16" font-weight="700" fill="#FBBF24">Phase 4: Luteal (Days 17–28)</text>
    <text x="16" y="48" font-family="sans-serif" font-size="16" fill="#F1F5F9">Progesterone dominates.</text>
    <text x="16" y="70" font-family="sans-serif" font-size="16" fill="#F1F5F9">Focus on comfort &amp; warmth;</text>
    <text x="16" y="92" font-family="sans-serif" font-size="16" fill="#94A3B8">premenstrual PMS sensitivity.</text>
  </g>

  <rect x="30" y="480" width="740" height="76" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="50" y="510" font-family="sans-serif" font-size="16" fill="#F1F5F9">Desire naturally fluctuates across the month. Hormonal contraception, stress,</text>
  <text x="50" y="536" font-family="sans-serif" font-size="16" fill="#F1F5F9">and life stages like pregnancy or menopause shift this personal rhythm.</text>
</svg>