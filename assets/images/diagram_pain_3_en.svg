<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>The arousal scale from 1 to 10</title>
  <desc>Horizontal scale: the relaxation window lies at 6 to 7, the point of no return at 9.5. Pauses and calm breathing keep arousal within the range.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="barClip">
      <rect x="90" y="351" width="620" height="18" rx="9"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="#140D1C"/>
  <ellipse cx="400" cy="340" rx="330" ry="220" fill="url(#glow)"/>

  <text x="400" y="60" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="34" font-weight="700">The Arousal Scale</text>
  <text x="400" y="94" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="20" font-weight="700">From 1 to 10: room instead of struggle</text>
  <text x="400" y="136" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="19">The higher the number, the closer the climax.</text>

  <!-- Scale bar -->
  <rect x="90" y="351" width="620" height="18" rx="9" fill="#334155"/>
  <g clip-path="url(#barClip)">
    <rect x="434" y="351" width="69" height="18" fill="#34D399"/>
    <rect x="503" y="351" width="173" height="18" fill="#FBBF24"/>
    <rect x="676" y="351" width="34" height="18" fill="#FB7185"/>
  </g>

  <!-- Tick marks -->
  <g stroke="#F1F5F9" stroke-width="2" opacity="0.8">
    <line x1="90" y1="344" x2="90" y2="376"/>
    <line x1="159" y1="344" x2="159" y2="376"/>
    <line x1="228" y1="344" x2="228" y2="376"/>
    <line x1="297" y1="344" x2="297" y2="376"/>
    <line x1="366" y1="344" x2="366" y2="376"/>
    <line x1="434" y1="344" x2="434" y2="376"/>
    <line x1="503" y1="344" x2="503" y2="376"/>
    <line x1="572" y1="344" x2="572" y2="376"/>
    <line x1="641" y1="344" x2="641" y2="376"/>
    <line x1="710" y1="344" x2="710" y2="376"/>
  </g>

  <!-- Numbers -->
  <g fill="#F1F5F9" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="90" y="402">1</text>
    <text x="159" y="402">2</text>
    <text x="228" y="402">3</text>
    <text x="297" y="402">4</text>
    <text x="366" y="402">5</text>
    <text x="434" y="402">6</text>
    <text x="503" y="402">7</text>
    <text x="572" y="402">8</text>
    <text x="641" y="402">9</text>
    <text x="710" y="402">10</text>
  </g>

  <!-- Relaxation window -->
  <path d="M434 280 L434 258 L503 258 L503 280" fill="none" stroke="#34D399" stroke-width="2.5"/>
  <text x="468" y="240" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="20" font-weight="700">Relaxation window</text>

  <!-- Point of no return -->
  <line x1="676" y1="292" x2="676" y2="426" stroke="#FB7185" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="676,262 686,278 676,294 666,278" fill="#FB7185"/>
  <text x="676" y="222" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="19" font-weight="700">Point of no</text>
  <text x="676" y="244" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="19" font-weight="700">return</text>

  <!-- Explanation -->
  <text x="400" y="464" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="20">Aim: stay in the 6 to 7 range for a long time.</text>
  <text x="400" y="496" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="18">Pauses and calm breathing lower arousal.</text>
  <text x="400" y="530" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="18">Past the point of no return, there is only forward.</text>
</svg>
