<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Der Beckenboden: Heben, Senken und Weiten</title>
  <desc>Schalenmodell des Beckenbodens mit drei Bewegungsdimensionen statt reiner Dauerspannung</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140D1C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">Der Beckenboden: Heben, Senken und Weiten</text>
  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94A3B8">schematisch, dreidimensionale Schalenform</text>
  <!-- 3D-Schalenmodell links -->
  <g transform="translate(40, 95)">
    <rect width="340" height="360" rx="14" fill="url(#card)" stroke="#FB7185" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="170" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#FB7185">Schalenform im Beckenring</text>

    <!-- Beckenknochen-Rahmen angedeutet -->
    <path d="M50 80 C80 60 260 60 290 80 C270 140 280 200 290 260 C250 270 90 270 50 260 C60 200 70 140 50 80 Z" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="170" y="75" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94A3B8">↑ Schambein (vorne)</text>
    <text x="170" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94A3B8">↓ Steißbein (hinten)</text>
    <text x="25" y="180" font-family="sans-serif" font-size="16" fill="#94A3B8">Sitzbein</text>
    <text x="295" y="180" font-family="sans-serif" font-size="16" fill="#94A3B8">Sitzbein</text>

    <!-- Schale / Hängematte des Beckenbodens -->
    <ellipse cx="170" cy="175" rx="90" ry="55" fill="url(#bowlGrad)" stroke="#FB7185" stroke-width="2.5"/>
    <ellipse cx="170" cy="180" rx="45" ry="25" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>

    <!-- 1. Heben (Pfeil nach oben-innen) -->
    <path d="M170 200 L170 155" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
    <polygon points="0,-7 14,0 0,7" fill="#34D399" transform="translate(170 150) rotate(-90)"/>

    <!-- 2. Weiten (Pfeile nach außen links/rechts) -->
    <path d="M150 180 L100 180" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="0,-6 12,0 0,6" fill="#38BDF8" transform="translate(95 180) rotate(180)"/>
    <path d="M190 180 L240 180" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="0,-6 12,0 0,6" fill="#38BDF8" transform="translate(245 180) rotate(0)"/>

    <!-- 3. Senken (Pfeil nach unten) -->
    <path d="M170 165 L170 215" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
    <polygon points="0,-6 12,0 0,6" fill="#FBBF24" transform="translate(170 220) rotate(90)"/>

    <text x="170" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#F1F5F9">Elastische Mitte (Zentrum)</text>
  </g>
  <g transform="translate(410, 95)">
    <rect width="350" height="106" rx="12" fill="url(#card)" stroke="#34D399" stroke-width="1.6"/>
    <text x="16" y="32" font-family="sans-serif" font-size="17" font-weight="700" fill="#34D399">1. Heben &amp; Anspannen</text>
    <text x="16" y="60" font-family="sans-serif" font-size="16" fill="#F1F5F9">Zieht nach innen-oben. Sichert Kontinenz,</text>
    <text x="16" y="84" font-family="sans-serif" font-size="16" fill="#94A3B8">schützt Organe bei plötzlicher Belastung.</text>
  </g>
  <g transform="translate(410, 222)">
    <rect width="350" height="106" rx="12" fill="url(#card)" stroke="#FBBF24" stroke-width="1.6"/>
    <text x="16" y="32" font-family="sans-serif" font-size="17" font-weight="700" fill="#FBBF24">2. Senken &amp; Grundtonus</text>
    <text x="16" y="60" font-family="sans-serif" font-size="16" fill="#F1F5F9">Gleitet elastisch zurück in die Mitte.</text>
    <text x="16" y="84" font-family="sans-serif" font-size="16" fill="#94A3B8">Entspannter Ruhezustand zwischen Impulsen.</text>
  </g>
  <g transform="translate(410, 349)">
    <rect width="350" height="106" rx="12" fill="url(#card)" stroke="#38BDF8" stroke-width="1.6"/>
    <text x="16" y="32" font-family="sans-serif" font-size="17" font-weight="700" fill="#38BDF8">3. Weiten &amp; Loslassen</text>
    <text x="16" y="60" font-family="sans-serif" font-size="16" fill="#F1F5F9">Gibt nach außen und unten bewusst Raum.</text>
    <text x="16" y="84" font-family="sans-serif" font-size="16" fill="#94A3B8">Unverzichtbar für Geburt, Stuhlgang &amp; Lust.</text>
  </g>
  <rect x="40" y="480" width="720" height="76" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#FB7185" stroke-width="1.5"/>
  <text x="60" y="510" font-family="sans-serif" font-size="16" fill="#F1F5F9">Bei Stress ist der Beckenboden oft nicht zu schwach, sondern hyperton (dauerangespannt).</text>
  <text x="60" y="536" font-family="sans-serif" font-size="16" fill="#F1F5F9">Wer schon zu fest ist, braucht kein Dauertraining, sondern bewusstes Weiten.</text>
</svg>
