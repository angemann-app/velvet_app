<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <title>Schleimhaut im hormonellen Wandel</title>
  <desc>Veränderungen der Scheidenschleimhaut in den Wechseljahren und die drei Schutzfaktoren</desc>
  <rect width="800" height="600" fill="#140D1C"/>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  
  <text x="40" y="48" fill="#F1F5F9" font-family="sans-serif" font-size="24px" font-weight="bold">Wechseljahre: Schleimhaut &amp; Lust im Wandel</text>
  <text x="40" y="78" fill="#94A3B8" font-family="sans-serif" font-size="16px">Was hormonell passiert &amp; was verlässlich schützt</text>

  <!-- Left Card: The change -->
  <rect x="40" y="105" width="345" height="430" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="138" fill="#38BDF8" font-family="sans-serif" font-size="18px" font-weight="bold">Hormonelle Veränderung</text>
  
  <rect x="60" y="155" width="305" height="135" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="75" y="185" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Sinkender Östrogenspiegel:</text>
    <text x="75" y="209" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Scheidenschleimhaut wird dünner,</text>
    <text x="75" y="233" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">trockener und verletzlicher.</text>

  <rect x="60" y="310" width="305" height="195" rx="10" fill="#0F172A" stroke="#FB7185" stroke-width="1.5"/>
  <text x="75" y="340" fill="#FB7185" font-family="sans-serif" font-size="16px" font-weight="bold">Wichtig:</text>
  <text x="75" y="370" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Trockenheit ist kein Mangel an Lust!</text>
    <text x="75" y="394" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Körper und Kopf sind zeitweise</text>
    <text x="75" y="418" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">nicht mehr im gleichen Takt.</text>

  <!-- Right Card: 3 Factors -->
  <rect x="415" y="105" width="345" height="430" rx="14" fill="#1E1B4B" stroke="#334155" stroke-width="1.5"/>
  <text x="435" y="138" fill="#34D399" font-family="sans-serif" font-size="18px" font-weight="bold">Drei Schutz- und Entlastungsfaktoren</text>

  <rect x="435" y="155" width="305" height="95" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="450" y="182" fill="#34D399" font-family="sans-serif" font-size="16px" font-weight="bold">1. Gleitmittel von Beginn an</text>
  <text x="450" y="206" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Nicht erst nehmen, wenn es reibt.</text>
    <text x="450" y="228" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Für den Alltag Feuchtigkeitsgele.</text>

  <rect x="435" y="265" width="305" height="95" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="450" y="292" fill="#C084FC" font-family="sans-serif" font-size="16px" font-weight="bold">2. Mehr Zeit für die Erregung</text>
  <text x="450" y="316" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Das vegetative Nervensystem</text>
    <text x="450" y="338" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">braucht länger für Durchblutung.</text>

  <rect x="435" y="375" width="305" height="130" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="450" y="402" fill="#38BDF8" font-family="sans-serif" font-size="16px" font-weight="bold">3. Ärztliche Unterstützung</text>
  <text x="450" y="428" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Lokale Östrogen-Cremes wirken</text>
    <text x="450" y="450" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">direkt am Gewebe, ohne den</text>
    <text x="450" y="472" fill="#F1F5F9" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">ganzen Körper zu belasten.</text>

  <text x="400" y="570" fill="#94A3B8" font-family="sans-serif" font-size="16px" text-anchor="middle">schematisch, Lage und Größe sind individuell</text>

</svg>