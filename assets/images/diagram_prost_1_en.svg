<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Male Pelvis: Prostate Location (Section)</title>
  <desc>Schematic side section: bladder, prostate, urethra, rectum and perineum</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140D1C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9F1239" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">Male Pelvis: Prostate Location (Section)</text>
  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94A3B8">schematic, position and size vary</text>
  <g transform="translate(10, 0)">
    <!-- Schambein vorne links -->
    <path d="M140 220 C135 240 145 260 160 265 C175 270 185 250 180 230 C175 210 145 200 140 220 Z" fill="#475569" stroke="#64748B" stroke-width="2"/>
    <circle cx="155" cy="235" r="13" fill="#94A3B8"/><text x="155" y="241" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">6</text>

    <!-- Harnblase -->
    <ellipse cx="230" cy="150" rx="58" ry="42" fill="#38BDF8" fill-opacity="0.22" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="230" cy="150" r="13" fill="#38BDF8"/><text x="230" y="156" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">1</text>

    <!-- Prostata: umschließt den Harnröhrenansatz unter der Blase -->
    <path d="M205 200 C200 185 260 185 255 200 C265 225 245 250 230 250 C215 250 195 225 205 200 Z" fill="url(#roseGrad)" stroke="#FB7185" stroke-width="2.5"/>
    <!-- Zeiger von Badge 2 zur Prostata -->
    <line x1="272" y1="218" x2="252" y2="218" stroke="#FB7185" stroke-width="2"/>
    <circle cx="285" cy="218" r="13" fill="#FB7185"/><text x="285" y="224" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">2</text>

    <!-- Harnröhre durch die Prostata nach vorne -->
    <path d="M230 188 L230 240 C228 270 215 300 200 325 L160 370" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="190" cy="310" r="13" fill="#38BDF8"/><text x="190" y="316" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">3</text>

    <!-- Rektum / Enddarm dahinter -->
    <path d="M330 110 C310 180 300 230 295 270 C290 310 300 360 320 400" fill="none" stroke="#A78BFA" stroke-width="24" stroke-linecap="round" opacity="0.6"/>
    <path d="M330 110 C310 180 300 230 295 270 C290 310 300 360 320 400" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <circle cx="310" cy="260" r="13" fill="#A78BFA"/><text x="310" y="266" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">4</text>

    <!-- Dammbereich (Hautlinie außen zwischen Peniswurzel und Anus) -->
    <path d="M190 370 C220 380 250 390 305 400" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="250" cy="385" r="13" fill="#FBBF24"/><text x="250" y="391" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">5</text>
  </g>
  <circle cx="470" cy="100" r="13" fill="#38BDF8"/><text x="470" y="106" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">1</text>
  <text x="496" y="106" font-family="sans-serif" font-size="16" fill="#F1F5F9">Bladder</text>
  <circle cx="470" cy="144" r="13" fill="#FB7185"/><text x="470" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">2</text>
  <text x="496" y="150" font-family="sans-serif" font-size="16" fill="#F1F5F9">Prostate (chestnut-sized)</text>
  <circle cx="470" cy="188" r="13" fill="#38BDF8"/><text x="470" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">3</text>
  <text x="496" y="194" font-family="sans-serif" font-size="16" fill="#F1F5F9">Urethra (passes through)</text>
  <circle cx="470" cy="232" r="13" fill="#A78BFA"/><text x="470" y="238" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">4</text>
  <text x="496" y="238" font-family="sans-serif" font-size="16" fill="#F1F5F9">Rectum</text>
  <circle cx="470" cy="276" r="13" fill="#FBBF24"/><text x="470" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">5</text>
  <text x="496" y="282" font-family="sans-serif" font-size="16" fill="#F1F5F9">Perineum (outer bridge)</text>
  <circle cx="470" cy="320" r="13" fill="#94A3B8"/><text x="470" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#1A1224">6</text>
  <text x="496" y="326" font-family="sans-serif" font-size="16" fill="#F1F5F9">Pubic bone</text>
  <rect x="40" y="470" width="720" height="76" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#FB7185" stroke-width="1.5"/>
  <text x="60" y="500" font-family="sans-serif" font-size="16" fill="#F1F5F9">The prostate lies right against the anterior rectal wall beneath the bladder.</text>
  <text x="60" y="526" font-family="sans-serif" font-size="16" fill="#F1F5F9">It can be reached gently from outside via the perineum as well as from inside.</text>
</svg>
