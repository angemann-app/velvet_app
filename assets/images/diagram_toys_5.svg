<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Materialschonend aufbewahren</title>
  <desc>Vier Merkkästen mit Symbolen: Baumwollbeutel, Schutz vor UV-Licht, getrennte Materialien und trockene Lagerung.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#140D1C"/>
  <ellipse cx="400" cy="320" rx="350" ry="235" fill="url(#glow)"/>

  <text x="400" y="50" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="31" font-weight="700">Materialschonend aufbewahren</text>
  <text x="400" y="84" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="20" font-weight="700">Vier einfache Regeln</text>
  <text x="400" y="116" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="18">So bleiben Toys sauber, weich und sicher</text>

  <g>
    <rect x="60" y="160" width="330" height="140" rx="14" fill="#1C1327" stroke="#FB7185" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="88" y="218" width="34" height="34" rx="6" fill="none" stroke="#FB7185" stroke-width="2.5"/>
    <path d="M92 218 q13 -14 26 0" fill="none" stroke="#FB7185" stroke-width="2.5"/>
    <line x1="96" y1="218" x2="92" y2="208" stroke="#FB7185" stroke-width="2"/>
    <line x1="114" y1="218" x2="118" y2="208" stroke="#FB7185" stroke-width="2"/>
    <text x="155" y="200" fill="#FB7185" font-family="sans-serif" font-size="19" font-weight="700">Baumwollbeutel</text>
    <text x="155" y="238" fill="#F1F5F9" font-family="sans-serif" font-size="16">luftig und staubfrei</text>
    <text x="155" y="264" fill="#94A3B8" font-family="sans-serif" font-size="16">schützt vor Staub</text>
  </g>

  <g>
    <rect x="410" y="160" width="330" height="140" rx="14" fill="#1C1327" stroke="#FB7185" stroke-width="2" stroke-opacity="0.45"/>
    <circle cx="458" cy="230" r="11" fill="none" stroke="#FB7185" stroke-width="2.5"/>
    <line x1="458" y1="213" x2="458" y2="207" stroke="#FB7185" stroke-width="2"/>
    <line x1="458" y1="247" x2="458" y2="253" stroke="#FB7185" stroke-width="2"/>
    <line x1="441" y1="230" x2="435" y2="230" stroke="#FB7185" stroke-width="2"/>
    <line x1="475" y1="230" x2="481" y2="230" stroke="#FB7185" stroke-width="2"/>
    <line x1="446" y1="218" x2="442" y2="214" stroke="#FB7185" stroke-width="2"/>
    <line x1="470" y1="242" x2="474" y2="246" stroke="#FB7185" stroke-width="2"/>
    <line x1="470" y1="218" x2="474" y2="214" stroke="#FB7185" stroke-width="2"/>
    <line x1="446" y1="242" x2="442" y2="246" stroke="#FB7185" stroke-width="2"/>
    <line x1="440" y1="250" x2="476" y2="210" stroke="#FB7185" stroke-width="2.5"/>
    <text x="505" y="200" fill="#FB7185" font-family="sans-serif" font-size="19" font-weight="700">Kein UV-Licht</text>
    <text x="505" y="238" fill="#F1F5F9" font-family="sans-serif" font-size="16">dunkel und kühl lagern</text>
    <text x="505" y="264" fill="#94A3B8" font-family="sans-serif" font-size="16">Farbe bleibt länger</text>
  </g>

  <g>
    <rect x="60" y="318" width="330" height="140" rx="14" fill="#1C1327" stroke="#FB7185" stroke-width="2" stroke-opacity="0.45"/>
    <circle cx="92" cy="388" r="10" fill="none" stroke="#FB7185" stroke-width="2.5"/>
    <circle cx="118" cy="388" r="10" fill="none" stroke="#FB7185" stroke-width="2.5"/>
    <line x1="105" y1="370" x2="105" y2="406" stroke="#FB7185" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="155" y="358" fill="#FB7185" font-family="sans-serif" font-size="19" font-weight="700">Materialien trennen</text>
    <text x="155" y="396" fill="#F1F5F9" font-family="sans-serif" font-size="16">hart und weich getrennt</text>
    <text x="155" y="422" fill="#94A3B8" font-family="sans-serif" font-size="16">nichts zusammendrücken</text>
  </g>

  <g>
    <rect x="410" y="318" width="330" height="140" rx="14" fill="#1C1327" stroke="#FB7185" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M458 370 C470 386 470 396 458 400 C446 396 446 386 458 370 Z" fill="none" stroke="#FB7185" stroke-width="2.5"/>
    <line x1="442" y1="404" x2="474" y2="366" stroke="#FB7185" stroke-width="2.5"/>
    <text x="505" y="358" fill="#FB7185" font-family="sans-serif" font-size="19" font-weight="700">Trocken lagern</text>
    <text x="505" y="396" fill="#F1F5F9" font-family="sans-serif" font-size="16">erst trocknen, dann packen</text>
    <text x="505" y="422" fill="#94A3B8" font-family="sans-serif" font-size="16">keine Feuchtigkeit</text>
  </g>

  <text x="400" y="540" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="20">Ein fester Platz schützt Material, Farbe und Hygiene.</text>
  <text x="400" y="566" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="18">Beutel, Dunkelheit, Trennung und Trockenheit genügen.</text>
  <text x="400" y="590" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="18">So bleibt jedes Toy länger schön und sicher.</text>
</svg>
